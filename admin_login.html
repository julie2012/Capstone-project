<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Sta. Justa National High School</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        :root {
            --primary: #17971d; 
            --primary-glow: rgba(23, 151, 29, 0.4);
            --secondary: #224db4;
            --secondary-glow: rgba(34, 77, 180, 0.4);
            --bg-dark: #0f172a;
            --text-dark: #1e293b;
            --text-light: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #dbeafe;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.70)),
                url("img/school-background.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
        }

        .bg-shapes { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none; }
        .shape { position: absolute; border-radius: 50%; filter: blur(80px); animation: floatBlob 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); }
        .shape-1 { top: -10%; left: 10%; width: 40vw; height: 40vw; background: rgba(255, 255, 255, 0.18); animation-delay: 0s; }
        .shape-2 { bottom: -10%; right: 10%; width: 45vw; height: 45vw; background: rgba(255, 255, 255, 0.14); animation-delay: -5s; }
        .shape-3 { top: 40%; left: 40%; width: 30vw; height: 30vw; background: rgba(255, 255, 255, 0.12); animation-duration: 20s; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 80px) scale(1.1); }
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.84);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px auto;
            background: #ffffff;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.14);
            transform: none;
            transition: transform 0.3s ease;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .login-wrapper:hover .brand-icon {
            transform: scale(1.05);
        }
        .brand-icon img { width: 100%; height: 100%; object-fit: cover; }

        .login-header h1 {
            font-size: 22px;
            font-weight: 900;
            color: var(--bg-dark);
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .login-header p {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 45px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:hover {
            border-color: #cbd5e1;
        }

        .input-group input:focus {
            background: #ffffff;
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px var(--secondary-glow);
        }

        .input-group input:focus + i {
            color: var(--secondary);
        }

        .options-row {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 24px;
            font-size: 12px;
            font-weight: 600;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--secondary), #3b82f6);
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 10px 20px var(--secondary-glow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg);
            transition: 0.5s;
        }

        .btn-login:hover::after {
            left: 150%;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px var(--secondary-glow);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-header">
            <div class="brand-icon">
                <img src="img/school-logo.jpg" alt="Sta. Justa National High School Logo">
            </div>
            <h1>Sta. Justa National High School</h1>
            <p>Admin Portal Login</p>
        </div>

        <form id="adminLoginForm">
            <div class="input-group">
                <input type="email" id="adminUsername" placeholder="Administrator Email" autocomplete="username" required>
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-group">
                <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password" required>
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="options-row">
                <label class="checkbox-group">
                    <input type="checkbox" id="rememberMe"> Keep me signed in
                </label>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                Authenticate <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div class="login-footer">
            &copy; 2026 Sta. Justa National High School.<br>Authorized Personnel Only.
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCL--aGTWJEcu7ErNZEI9RS4carF82dut8",
            authDomain: "stajusta-entrance-exam.firebaseapp.com",
            databaseURL: "https://stajusta-entrance-exam-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "stajusta-entrance-exam",
            storageBucket: "stajusta-entrance-exam.firebasestorage.app",
            messagingSenderId: "596788444273",
            appId: "1:596788444273:web:57d8ff2e665d9bf6bbafd0"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const adminUid = "XXtbkWz1UxdGcFekK4Q8TDKVczP2";

        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('rememberedAdminEmail');
            if (savedEmail) {
                document.getElementById('adminUsername').value = savedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });

        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...';
            loginBtn.style.opacity = '0.8';
            loginBtn.style.pointerEvents = 'none';

            try {
                // Save the admin session on this browser origin before navigating
                // to the dashboard, so its auth-state check can restore the user.
                await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                const credential = await auth.signInWithEmailAndPassword(email, password);
                if (credential.user.uid !== adminUid) {
                    await auth.signOut();
                    throw new Error('This account is not authorized as the system administrator.');
                }
                if (rememberMe) localStorage.setItem('rememberedAdminEmail', email);
                else localStorage.removeItem('rememberedAdminEmail');
                window.location.href = "admin_new/admin_dash.html";
            } catch (error) {
                loginBtn.innerHTML = 'Authenticate <i class="fa-solid fa-arrow-right-to-bracket"></i>';
                loginBtn.style.opacity = '1';
                loginBtn.style.pointerEvents = 'auto';
                Swal.fire({
                    icon: 'error',
                    title: 'Sign-in failed',
                    text: error.message.includes('not authorized') ? error.message : 'Check your email and password, then try again.',
                    confirmButtonColor: '#ef4444'
                });
            }
        });
    </script>
</body>
</html>
